name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - run: python -m pip install --upgrade pip
    - run: pip install -e ".[dev]"
    - name: Run tests
      run: python -m pytest tests/v2/ -x --tb=short -q
