# Agency Agents 角色配置
# 从 agency-agents-zh 项目导入的 144+ 个专家 Agent 角色
# Worker Agent 将根据任务场景自主匹配这些角色

# ═══════════════════════════════════════════════════════════════
# 工程开发类 (Engineering)
# ═══════════════════════════════════════════════════════════════
engineering:
  - name: "后端架构师"
    id: "engineering-backend-architect"
    description: "资深后端架构师，专精可扩展系统设计、数据库架构、API 开发和云基础设施"
    emoji: "⚙️"
    keywords: ["后端", "架构", "数据库", "API", "微服务", "系统设计", "服务器", "云基础设施", "backend", "architecture", "database"]
    match_patterns: ["设计.*系统", "数据库.*架构", "API.*开发", "微服务", "后端.*开发"]
    
  - name: "前端开发工程师"
    id: "engineering-frontend-developer"
    description: "专业前端开发工程师，精通现代Web技术栈、响应式设计和性能优化"
    emoji: "🎨"
    keywords: ["前端", "React", "Vue", "JavaScript", "CSS", "HTML", "响应式", "网页", "frontend", "web"]
    match_patterns: ["前端.*开发", "网页.*设计", "React.*组件", "Vue.*应用"]
    
  - name: "AI工程师"
    id: "engineering-ai-engineer"
    description: "AI工程师，专精机器学习模型开发、深度学习架构和AI系统集成"
    emoji: "🤖"
    keywords: ["AI", "机器学习", "深度学习", "神经网络", "模型训练", "人工智能", "ml", "dl", "ai"]
    match_patterns: ["AI.*开发", "机器学习.*模型", "深度学习", "神经网络"]
    
  - name: "DevOps自动化工程师"
    id: "engineering-devops-automator"
    description: "DevOps自动化专家，专精CI/CD流水线、容器化编排和基础设施即代码"
    emoji: "🔧"
    keywords: ["DevOps", "CI/CD", "Docker", "Kubernetes", "自动化", "部署", "运维", "devops", "deploy"]
    match_patterns: ["CI/CD.*流水线", "Docker.*容器", "Kubernetes.*编排", "自动化.*部署"]
    
  - name: "安全工程师"
    id: "engineering-security-engineer"
    description: "安全工程师，专精应用安全、渗透测试和安全架构设计"
    emoji: "🔒"
    keywords: ["安全", "渗透测试", "漏洞", "加密", "认证", "授权", "security", "penetration", "vulnerability"]
    match_patterns: ["安全.*审计", "渗透.*测试", "漏洞.*扫描", "加密.*算法"]
    
  - name: "数据工程师"
    id: "engineering-data-engineer"
    description: "数据工程师，专精数据管道、ETL流程和大数据处理架构"
    emoji: "📊"
    keywords: ["数据", "ETL", "数据管道", "大数据", "数据仓库", "data", "pipeline", "etl"]
    match_patterns: ["数据.*管道", "ETL.*流程", "大数据.*处理", "数据.*仓库"]
    
  - name: "移动应用开发工程师"
    id: "engineering-mobile-app-builder"
    description: "移动应用开发专家，精通iOS和Android原生及跨平台开发"
    emoji: "📱"
    keywords: ["移动", "iOS", "Android", "Flutter", "React Native", "APP", "mobile", "app"]
    match_patterns: ["移动.*开发", "iOS.*应用", "Android.*应用", "跨平台.*开发"]
    
  - name: "代码审查员"
    id: "engineering-code-reviewer"
    description: "代码审查专家，专精代码质量、最佳实践和技术债务管理"
    emoji: "🔍"
    keywords: ["代码审查", "code review", "代码质量", "最佳实践", "技术债务", "review", "quality"]
    match_patterns: ["代码.*审查", "代码.*质量", "技术.*债务"]
    
  - name: "技术文档工程师"
    id: "engineering-technical-writer"
    description: "技术文档专家，专精API文档、用户手册和技术博客写作"
    emoji: "📝"
    keywords: ["技术文档", "API文档", "用户手册", "技术博客", "documentation", "technical writing"]
    match_patterns: ["技术.*文档", "API.*文档", "用户.*手册"]

