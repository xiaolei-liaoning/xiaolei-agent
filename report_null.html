<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报告 - 无数据</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 12px;
        }
        p {
            color: #888;
            font-size: 16px;
            line-height: 1.6;
        }
        .tag {
            display: inline-block;
            margin-top: 24px;
            padding: 6px 16px;
            background: #e8ecf1;
            border-radius: 20px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📭</div>
        <h1>报告内容为空</h1>
        <p>由于输入数据为 <code>null</code>，无法生成有意义的报告内容。<br>请提供有效的数据后再试。</p>
        <span class="tag">2026-06-30</span>
    </div>
</body>
</html>
