# 第三方应用配置
apps:
  twitter:
    name: Twitter
    api_url: https://api.twitter.com
    auth_method: bearer_token
    keywords: [twitter, tweet, social, 推特, 社交, 推文]
    priority: 4
    description: Twitter API集成
    config:
      api_key: ${TWITTER_BEARER_TOKEN:-}
  
  discord:
    name: Discord
    api_url: https://discord.com/api/v10
    auth_method: bot_token
    keywords: [discord, server, channel, message,  discord, 服务器, 频道, 消息]
    priority: 4
    description: Discord API集成
    config:
      api_key: ${DISCORD_TOKEN:-}
  
  jira:
    name: Jira
    api_url: https://your-domain.atlassian.net
    auth_method: basic_auth
    keywords: [jira, issue, project, task, 项目, 任务, 问题]
    priority: 3
    description: Jira API集成
    config:
      email: ${JIRA_EMAIL:-}
      api_token: ${JIRA_API_TOKEN:-}
  
  slack:
    name: Slack
    api_url: https://slack.com/api
    auth_method: api_key
    keywords: [slack, chat, message, channel, 聊天, 消息, 频道]
    priority: 4
    description: Slack API集成
    config:
      api_key: ${SLACK_API_KEY:-}
  
  trello:
    name: Trello
    api_url: https://api.trello.com/1
    auth_method: api_key
    keywords: [trello, board, card, task, 看板, 卡片, 任务]
    priority: 3
    description: Trello API集成
    config:
      api_key: ${TRELLO_API_KEY:-}
      token: ${TRELLO_TOKEN:-}
  
  wechat:
    name: 微信
    api_url: https://api.weixin.qq.com
    auth_method: api_key
    keywords: [wechat, 微信, 公众号, 小程序, 企业微信]
    priority: 5
    description: 微信API集成
    config:
      app_id: ${WECHAT_APP_ID:-}
      app_secret: ${WECHAT_APP_SECRET:-}
  
  dingtalk:
    name: 钉钉
    api_url: https://oapi.dingtalk.com
    auth_method: api_key
    keywords: [dingtalk, 钉钉, 企业应用, 审批, 打卡]
    priority: 4
    description: 钉钉API集成
    config:
      app_key: ${DINGTALK_APP_KEY:-}
      app_secret: ${DINGTALK_APP_SECRET:-}
  
  feishu:
    name: 飞书
    api_url: https://open.feishu.cn
    auth_method: api_key
    keywords: [feishu, 飞书, 字节跳动, 企业协作, 文档]
    priority: 4
    description: 飞书API集成
    config:
      app_id: ${FEISHU_APP_ID:-}
      app_secret: ${FEISHU_APP_SECRET:-}
  
  weibo:
    name: 微博
    api_url: https://api.weibo.com
    auth_method: api_key
    keywords: [weibo, 微博, 热搜, 话题, 微博热搜]
    priority: 4
    description: 微博API集成
    config:
      app_key: ${WEIBO_APP_KEY:-}
      app_secret: ${WEIBO_APP_SECRET:-}
      access_token: ${WEIBO_ACCESS_TOKEN:-}
  
  zhihu:
    name: 知乎
    api_url: https://api.zhihu.com
    auth_method: api_key
    keywords: [zhihu, 知乎, 问题, 回答, 专栏]
    priority: 3
    description: 知乎API集成
    config:
      api_key: ${ZHIHU_API_KEY:-}
      api_secret: ${ZHIHU_API_SECRET:-}
  
  douyin:
    name: 抖音
    api_url: https://open.douyin.com
    auth_method: api_key
    keywords: [douyin, 抖音, 短视频, 直播, 抖音直播]
    priority: 4
    description: 抖音API集成
    config:
      client_key: ${DOUYIN_CLIENT_KEY:-}
      client_secret: ${DOUYIN_CLIENT_SECRET:-}
  
  baidu:
    name: 百度
    api_url: https://api.baidu.com
    auth_method: api_key
    keywords: [baidu, 百度, 搜索, 地图, 百度地图]
    priority: 3
    description: 百度API集成
    config:
      api_key: ${BAIDU_API_KEY:-}
      secret_key: ${BAIDU_SECRET_KEY:-}
  
  tencent_cloud:
    name: 腾讯云
    api_url: https://api.tencentcloudapi.com
    auth_method: api_key
    keywords: [tencent, 腾讯云, 云服务, 腾讯, 云函数]
    priority: 3
    description: 腾讯云API集成
    config:
      secret_id: ${TENCENT_SECRET_ID:-}
      secret_key: ${TENCENT_SECRET_KEY:-}
  
  alibaba_cloud:
    name: 阿里云
    api_url: https://ecs.aliyuncs.com
    auth_method: api_key
    keywords: [alibaba, 阿里云, 云服务, 阿里, 云服务器]
    priority: 3
    description: 阿里云API集成
    config:
      access_key_id: ${ALIBABA_ACCESS_KEY_ID:-}
      access_key_secret: ${ALIBABA_ACCESS_KEY_SECRET:-}
  
  huawei_cloud:
    name: 华为云
    api_url: https://ecs.cn-north-1.myhuaweicloud.com
    auth_method: api_key
    keywords: [huawei, 华为云, 云服务, 华为, 云服务器]
    priority: 3
    description: 华为云API集成
    config:
      ak: ${HUAWEI_AK:-}
      sk: ${HUAWEI_SK:-}
      project_id: ${HUAWEI_PROJECT_ID:-}
