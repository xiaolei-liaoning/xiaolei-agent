[project]
name = "xiaolongxia-agent"
version = "3.4.0"
requires-python = ">=3.13"
description = "小雷版小龙虾 AI Agent"
license = { text = "MIT" }

dependencies = [
    # ===== Web框架 =====
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "jinja2>=3.1.4",
    "lxml>=5.2.2",
    # ===== 数据库 =====
    "redis>=5.0.8",
    "pymysql>=1.1.1",
    "sqlalchemy>=2.0.31",
    # ===== LLM =====
    "zhipuai>=2.0.1",
    "httpx>=0.27.0",
    # ===== 搜索引擎 =====
    "duckduckgo-search>=6.2.0",
    "beautifulsoup4>=4.12.3",
    # ===== 向量数据库 =====
    "chromadb>=0.5.4",
    # ===== 中文Embedding模型 =====
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    # ===== 浏览器自动化 =====
    "playwright>=1.45.0",
    # ===== 数据分析 =====
    "pandas>=2.2.2",
    "matplotlib>=3.9.1",
    "openpyxl>=3.1.5",
    # paddleocr/paddlepaddle 在 [project.optional-dependencies] ocr 中
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "numpy>=2.2.4",
    # ===== 中文分词/关键词提取 (TF-IDF / TextRank) =====
    "jieba>=0.42.1",
    "networkx>=3.2.0",
    # ===== GUI自动化 (macOS) =====
    "pyobjc-core>=10.1",
    "pyobjc-framework-ApplicationServices>=10.1",
    "pyobjc-framework-Cocoa>=10.1",
    "PyAutoGUI>=0.9.54",
    "pyperclip>=1.8.2",
    # ===== 工具 =====
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "pyjwt>=2.8.0",
    "aiofiles>=23.2.1",
    "psutil>=5.9.8",
    "Pillow>=10.4.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "colorama>=0.4.6",
    "watchdog>=4.0.0",
]
ocr = [
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
addopts = "-m 'not integration_qa'"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["core", "skills", "tools", "infrastructure"]
skip = [".venv", "__pycache__", "build", "dist"]
